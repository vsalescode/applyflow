services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appyflow_test
      POSTGRES_USER: appyflow_test
      POSTGRES_PASSWORD: appyflow_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appyflow_test -d appyflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
